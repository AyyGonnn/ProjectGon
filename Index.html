<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTERLIFE PROJECT #SHOP - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #141414;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            text-align: center;
            width: 320px;
        }
        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 30px;
            /* Efek animasi mengkilap putih */
            background: linear-gradient(90deg, #ff3333 0%, #ffffff 50%, #ff3333 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #000000;
            border: 1px solid #333333;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login {
            background-color: #ff0000;
            color: white;
        }
        .btn-login:hover {
            background-color: #cc0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }
        .btn-guest {
            background-color: transparent;
            color: #ff4d4d;
            border: 1px solid #ff0000;
        }
        .btn-guest:hover {
            background-color: rgba(255, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="title">AFTERLIFE PROJECT<br>#SHOP</div>
    
    <input type="text" id="username" placeholder="Username / ID">
    <input type="password" id="password" placeholder="Password / Key">
    
    <button class="btn-login" onclick="login()">LOGIN</button>
    <button class="btn-guest" onclick="guestLogin()">GUEST LOGIN</button>
</div>

<script>
    function login() {
        let user = document.getElementById("username").value;
        let pass = document.getElementById("password").value;
        
        if(user === "" || pass === "") {
            alert("Harap isi Username dan Password!");
        } else {
            alert("Welcome, " + user + "! Mengalihkan ke menu Shop...");
            // Nanti kode ini diaktifkan untuk pindah halaman
            // window.location.href = "shop.html";
        }
    }

    function guestLogin() {
        alert("Masuk sebagai Guest. Akses beberapa fitur mungkin dibatasi.");
        // Nanti kode ini diaktifkan untuk pindah halaman
        // window.location.href = "shop.html";
    }
</script>

</body>
</html>
